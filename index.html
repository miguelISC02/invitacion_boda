<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Miguel &amp; Alison · 22.06.2026</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tipografías: script caligráfica para iniciales/nombres + serif clásica -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Estilos propios -->
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="is-locked">

  <main class="invite container-fluid" id="portada">
    <div class="row g-0 justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-7 cover">

        <!-- Novios -->
        <header class="intro">
          <div class="title-block">
            <h1 class="names" aria-label="Miguel y Alison">
              <span class="cap">M</span><span class="rest">IGUEL</span><span class="amp">&amp;</span><span class="cap">A</span><span class="rest">LISON</span>
            </h1>
            <p class="meta">13.03.2027</p>
          </div>
        </header>

        <!-- Sobre -->
        <div class="stage-wrap">
          <div class="stage">

            <!-- Alcatraces esquina superior derecha -->
            <div class="flowers flowers--top" aria-hidden="true">
              <img src="assets/img/Alcatraces.png" alt="" class="sway" width="487" height="500" decoding="async">
            </div>

            <button class="envelope" id="envelope" type="button" aria-label="Abrir la invitación" aria-expanded="false" aria-controls="contenido">

               <!-- Interior del sobre (forro de hojas) -->
              <img class="env-layer env-back" src="assets/img/sobre-interior.webp" alt="" width="1412" height="870">

              <!-- Tarjeta / foto (reemplaza assets/img/pareja.jpg) -->
              <div class="letter">
                <img src="assets/img/boda_sobre.jpeg" alt="Miguel y Alison" loading="eager"
                     onerror="this.onerror=null;this.src=this.dataset.fallback"
               data-fallback="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 220'%3E%3Cdefs%3E%3ClinearGradient id='g' x2='1' y2='1'%3E%3Cstop stop-color='%23d6d1c2'/%3E%3Cstop offset='1' stop-color='%239a9880'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='300' height='220' fill='url(%23g)'/%3E%3Ctext x='150' y='115' font-family='Georgia,serif' font-size='14' fill='%23fff' text-anchor='middle'%3EAgrega assets/img/boda_sobre.jpeg%3C/text%3E%3C/svg%3E">
              </div>

              <!-- Frente del sobre (foto sin solapa) -->
              <img class="env-layer env-front" src="assets/img/sobre-frente.webp" alt="" width="1412" height="870">

              <!-- Solapa: cara exterior (foto) y cara interior (forro) -->
              <div class="flap" aria-hidden="true">
                <img class="flap-outer" src="assets/img/sobre-solapa.webp" alt="" width="1412" height="643">
                <img class="flap-inner" src="assets/img/sobre-solapa-interior.webp" alt="" width="1412" height="642">
              </div>
            </button>

            <!-- Ramo esquina inferior izquierda -->
            <div class="flowers flowers--bottom" aria-hidden="true">
              <img src="assets/img/ramo.webp" alt="" class="sway sway--hang" width="699" height="1508" decoding="async">
            </div>
          </div>

          <!-- Indicación -->
          <div class="hint" id="hint">
            <svg viewBox="0 0 70 60" aria-hidden="true">
              <path class="arrow-path" d="M14 22 C4 8 24 2 32 10 C40 18 30 30 22 22 C16 14 34 6 46 20 C54 30 56 40 56 52"
                    fill="none" stroke="#3a3a36" stroke-width="1.3" stroke-linecap="round"/>
              <path class="arrow-path" d="M49 45 L56 54 L62 44" fill="none" stroke="#3a3a36" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Haz clic aquí para ver la invitación
          </div>
        </div>

        <!-- Invitado + reproductor -->
        <div class="details">
          
          <!-- Invitado -->
          <div class="guest">
            <p class="guest-name" id="guestName">Juan Ortiz Guerra</p>
            <p class="guest-seats">Hemos reservado (<span id="guestSeats">2</span>) cupo(s) para ti.</p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- =========================================================
       CONTENIDO (siguientes secciones)
       ========================================================= -->
  <section class="content" id="contenido" aria-hidden="true">
    <div class="container content-inner">
      <h2>Nuestra boda</h2>
      <p class="fs-5 mb-0">Aquí irán las siguientes secciones de la invitación.</p>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
